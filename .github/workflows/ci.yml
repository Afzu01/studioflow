name: StudioFlow checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [production-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studioflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studioflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studioflow_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studioflow_test
      SESSION_SECRET: integration-test-session-secret-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:4317
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.js
      - run: node --check server/auth.js
      - run: node --check server/validation.js
      - run: npm test
      - run: npm run build
